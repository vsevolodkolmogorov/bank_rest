databaseChangeLog:
  - changeSet:
      id: 1
      author: vsevolodkolmogorov
      changes:
        - createTable:
            tableName: card_block
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: request_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: card_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: requested_by_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: request_status_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: admin_comment
                  type: VARCHAR(50)
  - changeSet:
      id: 2
      author: vsevolodkolmogorov
      changes:
        - addForeignKeyConstraint:
            baseTableName: card_block
            baseColumnNames: requested_by_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_card_block_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: card_block
            baseColumnNames: card_id
            referencedTableName: card
            referencedColumnNames: id
            constraintName: fk_card_block_card
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: card_block
            baseColumnNames: request_status_id
            referencedTableName: request_status
            referencedColumnNames: id
            constraintName: fk_card_block_status
            onDelete: RESTRICT