databaseChangeLog:
  - changeSet:
      id: 1
      author: vsevolodkolmogorov
      changes:
        - createTable:
            tableName: card
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_number_encrypted
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_four_digits
                  type: VARCHAR(4)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expiry_date
                  type: CHAR(7)
                  constraints:
                    nullable: false
              - column:
                  name: status_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19,4)
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: vsevolodkolmogorov
      changes:
        - addForeignKeyConstraint:
            baseTableName: card
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_card_user
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: card
            baseColumnNames: status_id
            referencedTableName: card_status
            referencedColumnNames: id
            constraintName: fk_card_status
            onDelete: RESTRICT
